<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AiraBot Canvas</title>
    <script>
      (() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const platform = (params.get("platform") || "").trim().toLowerCase();
          if (platform) {
            document.documentElement.dataset.platform = platform;
            return;
          }
          if (/android/i.test(navigator.userAgent || "")) {
            document.documentElement.dataset.platform = "android";
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after {
          animation: none !important;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          14px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Roboto",
          sans-serif;
        background:
          radial-gradient(1200px 900px at 15% 20%, rgba(16, 185, 129, 0.4), rgba(0, 0, 0, 0) 55%),
          radial-gradient(900px 700px at 85% 30%, rgba(59, 130, 246, 0.3), rgba(0, 0, 0, 0) 60%),
          radial-gradient(1000px 900px at 60% 90%, rgba(249, 115, 22, 0.25), rgba(0, 0, 0, 0) 60%),
          #020617;
        color: #e5e7eb;
        overflow: hidden;
      }
      :root[data-platform="android"] body {
        background:
          radial-gradient(1200px 900px at 15% 20%, rgba(16, 185, 129, 0.62), rgba(0, 0, 0, 0) 55%),
          radial-gradient(900px 700px at 85% 30%, rgba(59, 130, 246, 0.52), rgba(0, 0, 0, 0) 60%),
          radial-gradient(1000px 900px at 60% 90%, rgba(249, 115, 22, 0.48), rgba(0, 0, 0, 0) 60%),
          #020617;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.03) 0,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 48px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 0,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 48px
          );
        transform: translate3d(0, 0, 0) rotate(-7deg);
        will-change: transform, opacity;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        opacity: 0.45;
        pointer-events: none;
        animation: airabot-grid-drift 140s ease-in-out infinite alternate;
      }
      :root[data-platform="android"] body::before {
        opacity: 0.8;
      }
      body::after {
        content: "";
        position: fixed;
        inset: -35%;
        background:
          radial-gradient(900px 700px at 30% 30%, rgba(16, 185, 129, 0.2), rgba(0, 0, 0, 0) 60%),
          radial-gradient(800px 650px at 70% 35%, rgba(59, 130, 246, 0.15), rgba(0, 0, 0, 0) 62%),
          radial-gradient(900px 800px at 55% 75%, rgba(249, 115, 22, 0.12), rgba(0, 0, 0, 0) 62%);
        filter: blur(28px);
        opacity: 0.52;
        will-change: transform, opacity;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translate3d(0, 0, 0);
        pointer-events: none;
        animation: airabot-glow-drift 110s ease-in-out infinite alternate;
      }
      :root[data-platform="android"] body::after {
        opacity: 0.85;
      }
      @supports (mix-blend-mode: screen) {
        body::after {
          mix-blend-mode: screen;
        }
      }
      @supports not (mix-blend-mode: screen) {
        body::after {
          opacity: 0.7;
        }
      }
      @keyframes airabot-grid-drift {
        0% {
          transform: translate3d(-12px, 8px, 0) rotate(-7deg);
          opacity: 0.4;
        }
        50% {
          transform: translate3d(10px, -7px, 0) rotate(-6.6deg);
          opacity: 0.56;
        }
        100% {
          transform: translate3d(-8px, 6px, 0) rotate(-7.2deg);
          opacity: 0.42;
        }
      }
      @keyframes airabot-glow-drift {
        0% {
          transform: translate3d(-18px, 12px, 0) scale(1.02);
          opacity: 0.4;
        }
        50% {
          transform: translate3d(14px, -10px, 0) scale(1.05);
          opacity: 0.52;
        }
        100% {
          transform: translate3d(-10px, 8px, 0) scale(1.03);
          opacity: 0.43;
        }
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        z-index: 1;
      }
      :root[data-platform="android"] #airabot-canvas {
        background:
          radial-gradient(1100px 800px at 20% 15%, rgba(16, 185, 129, 0.78), rgba(0, 0, 0, 0) 58%),
          radial-gradient(900px 650px at 82% 28%, rgba(59, 130, 246, 0.66), rgba(0, 0, 0, 0) 62%),
          radial-gradient(1000px 900px at 60% 88%, rgba(249, 115, 22, 0.58), rgba(0, 0, 0, 0) 62%),
          #0a0f1d;
      }
      #airabot-status {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 3;
      }
      #airabot-status .card {
        width: min(560px, 88vw);
        text-align: left;
        padding: 20px 24px;
        border-radius: 24px;
        background: linear-gradient(140deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.6));
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.6),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
      }
      #airabot-status .title {
        font:
          700 13px/1.2 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: #10b981; /* Emerald Green */
        margin-bottom: 4px;
      }
      #airabot-status .subtitle {
        margin-top: 8px;
        font:
          500 15px/1.45 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          system-ui,
          sans-serif;
        color: rgba(255, 255, 255, 0.95);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      airabot-a2ui-host {
        display: block;
        height: 100%;
        position: fixed;
        inset: 0;
        z-index: 4;
        --airabot-a2ui-inset-top: 28px;
        --airabot-a2ui-inset-right: 0px;
        --airabot-a2ui-inset-bottom: 0px;
        --airabot-a2ui-inset-left: 0px;
        --airabot-a2ui-scroll-pad-bottom: 0px;
        --airabot-a2ui-status-top: calc(50% - 18px);
        --airabot-a2ui-empty-top: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="airabot-canvas"></canvas>
    <div id="airabot-status">
      <div class="card">
        <div class="title" id="airabot-status-title">AiraBot Ready</div>
        <div class="subtitle" id="airabot-status-subtitle">Waiting to assist you, machane!</div>
      </div>
    </div>
    <airabot-a2ui-host></airabot-a2ui-host>
    <script src="a2ui.bundle.js"></script>
    <script>
      (() => {
        const canvas = document.getElementById("airabot-canvas");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("airabot-status");
        const titleEl = document.getElementById("airabot-status-title");
        const subtitleEl = document.getElementById("airabot-status-subtitle");
        const debugStatusEnabledByQuery = (() => {
          try {
            const params = new URLSearchParams(window.location.search);
            const raw = params.get("debugStatus") ?? params.get("debug");
            if (!raw) return false;
            const normalized = String(raw).trim().toLowerCase();
            return normalized === "1" || normalized === "true" || normalized === "yes";
          } catch (_) {
            return false;
          }
        })();
        let debugStatusEnabled = debugStatusEnabledByQuery;

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.floor(window.innerWidth * dpr));
          const h = Math.max(1, Math.floor(window.innerHeight * dpr));
          canvas.width = w;
          canvas.height = h;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener("resize", resize);
        resize();

        const setDebugStatusEnabled = (enabled) => {
          debugStatusEnabled = !!enabled;
          if (!statusEl) return;
          if (!debugStatusEnabled) {
            statusEl.style.display = "none";
          }
        };

        if (statusEl && !debugStatusEnabled) {
          statusEl.style.display = "none";
        }

        window.__airabot = {
          canvas,
          ctx,
          setDebugStatusEnabled,
          setStatus: (title, subtitle) => {
            if (!statusEl || !debugStatusEnabled) return;
            if (!title && !subtitle) {
              statusEl.style.display = "none";
              return;
            }
            statusEl.style.display = "flex";
            if (titleEl && typeof title === "string") titleEl.textContent = title;
            if (subtitleEl && typeof subtitle === "string") subtitleEl.textContent = subtitle;
            if (!debugStatusEnabled) {
              clearTimeout(window.__statusTimeout);
              window.__statusTimeout = setTimeout(() => {
                statusEl.style.display = "none";
              }, 3000);
            } else {
              clearTimeout(window.__statusTimeout);
            }
          },
        };
      })();
    </script>
  </body>
</html>
